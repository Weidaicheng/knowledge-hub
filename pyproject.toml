[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-hub"
version = "0.1.0"
description = "中心化知识库 MCP Server — 代码图谱 + 文档检索"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp<2.0.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
knowledge-hub = "knowledge_hub.server:main"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_hub"]
